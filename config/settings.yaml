# ==============================================================================
#  gold_m5_bot :: master configuration (KIJUN PULLBACK 3-LAYER ON M5)
#  Secrets can be overridden by environment variables:
#    MT5_LOGIN, MT5_PASSWORD, MT5_SERVER, MT5_PATH, TELEGRAM_TOKEN, ADMIN_IDS
# ==============================================================================

mt5:
  login: 0                     # int  -> your MT5 account number
  password: ""
  server: ""                   # e.g. "MetaQuotes-Demo"
  terminal_path: ""            # e.g. "C:/Program Files/MetaTrader 5/terminal64.exe"
  timeout_ms: 60000
  portable: false

symbol:
  name: "XAUUSD"
  # Brokers rename gold constantly; the client probes these in order.
  fallback_names: ["XAUUSD.a", "XAUUSDm", "XAUUSD_o", "XAUUSD.pro", "GOLD", "GOLDm", "XAUUSD.raw"]
  magic: 553311
  deviation_points: 30
  comment: "gold_m5_bot"

timeframes:
  trigger: "M5"                # اجرای مستقیم معاملات روی کندل‌های ۵ دقیقه‌ای
  intermediate: "M15"
  macro: "H1"

risk:
  base_balance: 533.0          # reference balance (used when MT5 is offline)
  risk_percent: 3.0            # % of live balance risked per trade
  min_lot: 0.01
  max_lot: 0.05
  max_positions_per_symbol: 1
  atr_period: 14
  sl_atr_multiplier: 1.5       # استاپ‌لاس ۱.۵ برابر ATR
  tp_atr_multiplier: 3.5       # تارگت ۳.۵ برابر ATR (نسبت ۱ به ۲.۳۳)
  breakeven_trigger_atr: 1.8   # انتقال استاپ به نقطه ورود در ۱.۸ برابر ATR
  breakeven_buffer_points: 5   # ۵ پوینت بالاتر از نقطه ورود (پوشش کامل اسپرد)
  trailing_trigger_atr: 99.0   # غیرفعال
  trailing_distance_atr: 1.5
  commission_per_lot: 0.0      # کارمزد حساب استاندارد
  min_sl_points: 40            # حداقل فاصله استاپ ۴۰ پوینت (۴۰ سنت)
  max_daily_loss_pct: 10.0     # سقف ضرر بسته‌شده روزانه (٪ از بالانس ابتدای روز سرور)
  max_daily_trades: 10         # سقف تعداد معامله در روز

session:
  start_hour: 6
  end_hour: 23
  max_spread_points: 30
  trade_weekdays: [0, 1, 2, 3, 4]   # دوشنبه تا جمعه
  close_all_before_weekend: false

strategy:
  active: "ichimoku_m15"     # orb_gold / ichimoku_m15 هم آماده‌اند
  available:
    - "kijun_pullback"
    - "orb_gold"
    - "ichimoku_m15"

  params:
    orb_gold:
      session_start_hour: 1     # باز شدن بازار طلا به وقت سرور بروکر
      initial_range_bars: 12    # ۱ ساعت کندل M5 = رنج اولیه
      confirm_bars: 36          # ۳ کندل H1 داخل رنج = رنج نهایی
      atr_period: 14
      sl_atr: 1.5
      tp_sl_multiplier: 3.5

    ichimoku_m15:
      session_start_hour: 1
      initial_range_bars: 12
      confirm_bars: 36
      atr_period: 14
      # مجموعه walk-forward (تنظیم‌شده روی M15)
      enable_trend_ema: false
      use_h1_filter: true
      h1_ema_period: 50
      enable_kijun: true
      enable_tenkan: true
      enable_sp2l: false
      kijun_near_atr: 0.20
      kijun_sl_atr: 1.6
      kijun_tp_sl_multiplier: 3.0
      tenkan_min_distance_atr: 0.40
      tenkan_tp_sl_multiplier: 3.0
      cooldown_bars: 6
      trade_start_hour: 12      # فقط سشن نیویورک
      trade_end_hour: 20
      min_atr: 0.40
      partial_tp_rr: 1.5
      partial_frac: 0.5

  params:
    kijun_pullback:
      # پارامترهای پایه اندیکاتورها
      ema_period: 200
      atr_period: 14
      min_atr: 0.40

      # پارامترهای ایچیموکو بدون شیفت
      tenkan_period: 9
      kijun_period: 26
      senkou_b_period: 52

      # لایه ۱: استراتژی پایه Kijun Pullback
      kijun_near_atr: 0.10
      kijun_sl_atr: 1.50
      kijun_tp_sl_multiplier: 2.00

      # لایه ۲: استراتژی شتابی Tenkan Momentum
      enable_tenkan: true
      tenkan_near_atr: 0.20
      tenkan_min_distance_atr: 0.50
      tenkan_max_distance_atr: 2.50
      tenkan_sl_atr: 1.40
      tenkan_tp_sl_multiplier: 2.00
      tenkan_min_body_fraction: 0.30
      tenkan_atr_rising_lookback: 5

      # لایه ۳: استراتژی شکار نقدینگی SP2L Sweep
      enable_sp2l: false
      sp2l_swing_lookback: 20
      sp2l_buffer: 0.30
      sp2l_min_sl_distance: 0.50
      sp2l_tp_sl_multiplier: 3.00
      sp2l_min_body_fraction: 0.30

      # فیلتر رژیم بازار (فقط معامله در بازار روندی)
      use_regime_filter: true
      regime_adx_period: 14
      regime_adx_min: 22.0
      regime_ema_period: 120
      regime_slope_lookback: 24
      regime_slope_min_atr: 1.0

      # دوره استراحت بین معاملات (کندل‌های M5)
      cooldown_bars: 1

    session_sweep:
      asian_start_hour: 0.0
      asian_end_hour: 6.0
      london_start_hour: 7.0
      london_end_hour: 12.0
      new_york_start_hour: 12.0
      new_york_end_hour: 19.0
      price_point: 0.01
      sweep_buffer_points: 4.0
      min_rejection_points: 3.5
      asian_min_range_points: 150.0
      asian_max_range_points: 3500.0
      london_min_range_points: 150.0
      london_max_range_points: 5000.0
      use_displacement_filter: true
      min_body_atr: 0.20
      require_htf_bias: false
      target_mode: "opposing_extreme"
      min_target_atr: 0.50
      max_target_atr: 8.0
      allow_london_sweeps: true
      allow_ny_asian_sweeps: true
      allow_ny_london_sweeps: true
      max_trades_per_session_direction: 1
      atr_period: 14

    ema_macd:
      fast_ema: 9
      slow_ema: 21
      m15_ema: 21
      h1_ema: 200
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      adx_period: 14
      min_adx: 20.0
      require_macd_above_zero: true

    ema_rsi:
      fast_ema: 21
      slow_ema: 50
      rsi_period: 14
      rsi_long_min: 50.0
      rsi_long_max: 72.0
      rsi_short_min: 28.0
      rsi_short_max: 50.0
      h1_ema: 200
      m15_ema: 21
      adx_period: 14
      min_adx: 20.0

    bb_rsi:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30.0
      rsi_overbought: 70.0
      h1_ema: 200
      adx_period: 14
      max_adx: 28.0
      respect_macro_trend: false

engine:
  loop_sleep_seconds: 1.0
  bars_to_load: 1000
  heartbeat_seconds: 30
  reconnect_backoff_seconds: [5, 10, 20, 40, 60]
  max_send_retries: 3
  telemetry_interval_seconds: 3600

backtest:
  bars: 75000                  # ۷۵ هزار کندل M5 (یک سال کامل بازار طلا)
  timeframe: "M5"              # بک‌تست مستقیم روی M5
  initial_balance: 533.0
  spread_points: 26            # اسپرد واقعی حساب (میانه تیک‌ها ۲۹؛ ربات فقط زیر ۳۰ معامله می‌کند)
  slippage_points: 0           # اسلیپیج صفر برای تست استاندارد
  commission_per_lot: 0.0      # کمیسیون حساب استاندارد
  bars_per_year: 74880         # ۲۸۸ کندل در روز * ۲۶۰ روز کاری
  simulate_breakeven: true     # فعال‌سازی مکانیسم بریک‌ایون (Breakeven)
  simulate_trailing: false

telegram:
  enabled: true
  token: ""   # از .env خوانده می‌شود (TELEGRAM_TOKEN) — توکن را اینجا ننویسید!
  admin_ids: [84078462]
  vip_channel_ids: []
  free_channel_ids: []
  vip_price_usd: 49
  vip_days_per_purchase: 30
  purchase_contact: "@GoldForgepro_bot"
  send_charts_to_vip: true
  send_manage_alerts_to_vip: true

database:
  path: "subscriptions.db"

logging:
  path: "logs/bot_{time:YYYY-MM-DD}.log"
  level: "INFO"
  rotation: "10 MB"
  retention: "21 days"
  backtrace: true
  diagnose: false


 
 
