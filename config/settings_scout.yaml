# ==============================================================================
#  gold-3strategies :: SCOUT — دیدبان ستاپ‌ها با تأیید دستی در تلگرام
#  اجرا:  py -3.11 tools/scout_bot.py --config config/settings_scout.yaml
#  روی حساب دمو و واقعی کار می‌کند. ربات خودش وارد نمی‌شود؛ فقط بعد از تأیید شما سفارش می‌گذارد.
# ==============================================================================

mt5:
  login: 0                     # از .env خوانده می‌شود (MT5_LOGIN_SCOUT یا MT5_LOGIN)
  password: ""
  server: ""
  terminal_path: ""            # مسیر ترمینال حساب اسکات
  timeout_ms: 60000
  portable: false

symbol:
  name: "XAUUSD"
  fallback_names: ["XAUUSD@", "GOLD", "XAUUSDm", "XAUUSD.a", "XAUUSD.pro"]
  magic: 735777                # جدا از 735511 و 553311
  deviation_points: 30
  comment: "scout"

timeframes:
  trigger: "M15"               # فقط برای اطلاع: اسکات همیشه روی کندل ۱۵ دقیقه‌ای کار می‌کند (در کد ثابت)
  intermediate: "M15"
  macro: "H1"

risk:
  base_balance: 530.0
  risk_percent: 1.0
  min_lot: 0.01
  max_lot: 0.01
  max_positions_per_symbol: 10
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  commission_per_lot: 0.0
  min_sl_points: 40            # اسکات از این استفاده نمی‌کند (حد ضرر از ستاپ و scout.sl_cap_usd می‌آید)
  max_forced_risk_percent: 0.0   # گارد برای اسکات خاموش است؛ حجم ثابت 0.01

scout:
  lot: 0.01                    # حجم ثابت همهٔ معاملات، برای مقایسهٔ منصفانه
  expiry_seconds: 1800         # مهلت پاسخ به هر هشدار (۳۰ دقیقه)
  h1_ema_period: 20
  loop_seconds: 2
  journal: "data/scout_journal_v2.csv"   # ستون‌های ثابت؛ فایل قدیمی دست نمی‌خورد
  merge_setups: true           # ستاپ‌های هم‌کندل و هم‌جهت در یک پیام
  block_hedge: true            # تأیید در جهت مخالف پوزیشن باز، ثبت نمی‌شود
  alert_while_open: true       # هشدارها با پوزیشن باز هم می‌آیند (قاعدهٔ مالک ۲۰۲۶-۱۰-۰۲)
  max_open: 2                  # حداکثر پوزیشن هم‌زمان اسکات
  max_total_risk_usd: 20.0     # سقف ریسک کل پوزیشن‌های باز (تا حد ضرر فعلی روی بروکر)
  heartbeat: "data/heartbeat_scout.txt"   # نگهبان از روی این فایل زنده‌بودن را می‌فهمد
  # حد ضرر (قواعد مالک، ۲۰۲۶-۱۰-۰۲): پوزیشن از حد مجاز ضرر رد نمی‌شود مگر «نگه دار» زده باشید
  soft_stop: true              # مدیریت حد ضرر اسکات روشن (false = حد ضرر ساده و ثابت روی بروکر)
  sl_cap_usd: 10.0             # فاصلهٔ حد ضرر سیگنال حداکثر ۱۰ دلار (لات ۰.۰۱)
  emergency_sl_mult: 3.0       # حد ضرر اضطراری هنگام «نگه دار» = ۳ برابر فاصله ...
  emergency_cap_usd: 20.0      # ... ولی حداکثر ۲۰ دلار ضرر
  approach_frac: 0.7           # در ۷۰٪ ریسک یک هشدار «نزدیک حد ضرر» با دکمهٔ نگه دار
  away_default: "close"        # حالت پیش‌فرض گرفتاری: close | hold | ai  (در تلگرام: /mode)
  mode_file: "data/scout_mode.json"
  ai_min_confidence: 60        # حالت ai: فقط HOLD با اطمینان ≥ این نگه داشته می‌شود؛ بقیه بسته
  ai_recheck_minutes: 15       # حالت ai: تا وقتی آن طرف حد ضرر است، هر ۱۵ دقیقه دوباره می‌پرسد
  ai_timeout_seconds: 60
  status_every_seconds: 300    # پیام وضعیت زندهٔ هر پوزیشن تأییدشده هر ۵ دقیقه به‌روز می‌شود
  state_file: "data/scout_state.json"   # پوزیشن‌های تحت نظر؛ بعد از ری‌استارت ادامه می‌دهد
  # پنل کنترل و نگهبان سلامت (/menu در تلگرام)
  flags_file: "data/scout_flags.json"   # توقف/ادامهٔ هشدارها (بعد از ری‌استارت می‌ماند)
  lock_file: "data/scout.lock"          # فقط یک نسخه از اسکات
  health_daily_utc_hour: 5     # پیام «سالمم» روزانه ساعت ۵ UTC (حدود ۸:۳۰ تهران)
  feed_stale_seconds: 600      # اگر ۱۰ دقیقه داده/قیمت از MT5 نیاید، هشدار
  # بستن ناموفق، یافتن پوزیشن، خطوط اطلاعاتی زیر هشدار (هیچ‌کدام سیگنالی را حذف نمی‌کند)
  reconcile_seconds: 60        # هر چند ثانیه پوزیشن‌های اسکاتِ بیرون از فهرست (مثلاً سفارش نامشخص) پیدا شوند
  close_retry_seconds: 15      # بستن ناموفق در حد ضرر: فاصلهٔ تلاش دوباره (بی‌صدا)
  close_fail_notify_minutes: 10   # ... و پیام تلگرام حداکثر هر چند دقیقه
  record_n: 30                 # خط کارنامه زیر هشدار: میانگین فرضی این تعداد نمونهٔ آخر همان ستاپ
  record_warn_r: -0.5          # زیر این میانگین با ⚠️ نشان داده می‌شود (فقط اطلاع)
  news:
    mode: "warn"               # warn = خط «📰 خبر مهم» زیر هشدار · off = خاموش
    minutes_before: 15         # پنجره دور اخبار پراهمیت دلار (Forex Factory، همان ماژول ORB)
    minutes_after: 15
  backfill_bars: 4             # بعد از گیر کردن یا ری‌استارت، کندل‌های جاافتادهٔ تا این تعداد (۴ = یک ساعت) با برچسب «دیرهنگام» بررسی شوند
  # همراه هشدارها و ابزارها (هیچ‌کدام سیگنالی را حذف نمی‌کند)
  chart:
    enabled: true              # نمودار زیر هر هشدار: محدودهٔ سود/ضرر/خنثی
    bars: 64                   # چند کندل ۱۵ دقیقه‌ای در نمودار
  whatif:
    enabled: true              # «اگر گرفته بودید…»: هشدار ردشده/منقضی/بازنشده دنبال می‌شود و نتیجه + دلیل می‌آید
    check_seconds: 30
    file: "data/scout_whatif.json"   # بعد از ری‌استارت ادامه می‌دهد
  scoreboard:
    enabled: true              # جدول امتیاز شبانه در تلگرام
    tehran_time: "23:55"
  price_alerts_file: "data/scout_price_alerts.json"   # /alert 4150
  # داشبورد وب: http://SERVER_IP:8082/?token=...  (مثل داشبورد دو ربات دیگر؛ پورت را در فایروال باز کنید)
  # توکن از .env خوانده می‌شود: DASHBOARD_TOKEN_SCOUT، وگرنه همان DASHBOARD_TOKEN دو داشبورد دیگر.
  # بدون توکن داشبورد روشن نمی‌شود. فقط خواندنی است؛ هیچ سفارشی از آن داده نمی‌شود.
  dashboard:
    enabled: true
    host: "0.0.0.0"
    port: 8082
    token: ""                  # خالی بگذارید؛ از .env می‌آید
    stats_minutes: 60          # نتیجهٔ فرضی ستاپ‌ها هر ۶۰ دقیقه دوباره حساب می‌شود
    compare:                   # بخش «رقابت»: دیتابیس دو ربات دیگر (فقط خواندن)
      - {name: "ORB", db: "subscriptions.db"}
      - {name: "ایچیموکو", db: "subscriptions_ichimoku.db"}

telegram:
  enabled: true
  token: ""
  token_env: "TELEGRAM_TOKEN_SCOUT"   # توکن ربات سوم را در .env بگذارید
  admin_ids: [84078462]

logging:
  path: "logs/scout_{time:YYYY-MM-DD}.log"
  level: "INFO"
  rotation: "10 MB"
  retention: "21 days"
