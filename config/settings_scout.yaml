# ==============================================================================
#  gold-3strategies :: SCOUT — دیدبان ستاپ‌ها با تأیید دستی در تلگرام
#  اجرا:  py -3.11 tools/scout_bot.py --config config/settings_scout.yaml
#  ⚠️ فقط حساب دمو. ربات خودش وارد نمی‌شود؛ فقط بعد از تأیید شما سفارش می‌گذارد.
# ==============================================================================

mt5:
  login: 0                     # از .env خوانده می‌شود (MT5_LOGIN_SCOUT یا MT5_LOGIN)
  password: ""
  server: ""
  terminal_path: ""            # مسیر ترمینال حساب دموی دوم
  timeout_ms: 60000
  portable: false

symbol:
  name: "XAUUSD"
  fallback_names: ["XAUUSD@", "GOLD", "XAUUSDm", "XAUUSD.a", "XAUUSD.pro"]
  magic: 735777                # جدا از 735511 و 553311
  deviation_points: 30
  comment: "scout"

timeframes:
  trigger: "M5"
  intermediate: "M15"
  macro: "H1"

risk:
  base_balance: 530.0
  risk_percent: 1.0
  min_lot: 0.01
  max_lot: 0.01
  max_positions_per_symbol: 10
  atr_period: 14
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  commission_per_lot: 0.0
  min_sl_points: 40
  max_forced_risk_percent: 0.0   # گارد برای اسکات خاموش است؛ حجم ثابت 0.01

scout:
  lot: 0.01                    # حجم ثابت همهٔ معاملات، برای مقایسهٔ منصفانه
  expiry_seconds: 1800         # مهلت پاسخ به هر هشدار (۳۰ دقیقه)
  h1_ema_period: 20
  loop_seconds: 2
  journal: "data/scout_journal_v2.csv"   # ستون‌های ثابت؛ فایل قدیمی دست نمی‌خورد
  merge_setups: true           # ستاپ‌های هم‌کندل و هم‌جهت در یک پیام
  block_hedge: true            # تأیید در جهت مخالف پوزیشن باز، ثبت نمی‌شود
  heartbeat: "data/heartbeat_scout.txt"   # نگهبان از روی این فایل زنده‌بودن را می‌فهمد
  # حد ضرر نرم (تصمیم مالک، ۲۰۲۶-۰۹-۳۰): حد ضرر سیگنال فقط هشدار است؛ بستن فقط با شما
  soft_stop: true
  emergency_sl_mult: 3.0       # حد ضرر اضطراری روی بروکر = ۳ برابر فاصلهٔ حد ضرر سیگنال (برای قطعی VPS/اینترنت)
  sl_reminder_seconds: 300     # زیر حد ضرر سیگنال و بدون تصمیم شما: یادآوری هر ۵ دقیقه
  status_every_seconds: 300    # پیام وضعیت زندهٔ هر پوزیشن تأییدشده هر ۵ دقیقه به‌روز می‌شود
  state_file: "data/scout_state.json"   # پوزیشن‌های تحت نظر؛ بعد از ری‌استارت ادامه می‌دهد

telegram:
  enabled: true
  token: ""
  token_env: "TELEGRAM_TOKEN_SCOUT"   # توکن ربات سوم را در .env بگذارید
  admin_ids: [84078462]

logging:
  path: "logs/scout_{time:YYYY-MM-DD}.log"
  level: "INFO"
  rotation: "10 MB"
  retention: "21 days"
